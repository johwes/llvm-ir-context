[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "llvm-ir-context"
version = "0.1.0"
description = "Deterministic LLVM IR → structured vulnerability context for LLM harness generation"
requires-python = ">=3.11"
dependencies = [
    "llvmlite>=0.43",
    "numpy>=1.24",
    "tree-sitter>=0.25",
    "tree-sitter-c>=0.23",
]

[project.scripts]
ir-score   = "llvm_ir_context.score_deterministic:main"
ir-context = "llvm_ir_context.slice_context:_demo_cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["llvm_ir_context*"]
